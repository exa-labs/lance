name: Build Exa wheels

on:
  push:
    branches:
      - exa/v9.0.1-txn-perf
    tags:
      - "v*-exa.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} wheel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            target: x86_64-unknown-linux-gnu
            aws_lc_cflags: ""
            target_cflags: ""
          - platform: aarch64
            target: aarch64-unknown-linux-gnu
            aws_lc_cflags: "-DAT_HWCAP2=26"
            target_cflags: "-D__ARM_ARCH=8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.LANCE_RELEASE_TOKEN }}

      - name: Make checkout authentication available to Cargo
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          echo "::add-mask::${auth_header}"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=${auth_header}"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils libssl-dev pkg-config unzip
          bash .github/workflows/build_linux_wheel/install-protoc.sh

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          AWS_LC_SYS_CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.aws_lc_cflags }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          CFLAGS_aarch64_unknown_linux_gnu: ${{ matrix.target_cflags }}
        with:
          command: build
          working-directory: python
          target: ${{ matrix.target }}
          container: off
          rust-toolchain: "1.91.0"
          maturin-version: "1.15.0"
          args: >-
            --release
            --strip
            --locked
            --zig
            --compatibility manylinux2014
            --out ${{ github.workspace }}/dist

      - name: Validate wheel provenance
        env:
          PLATFORM: ${{ matrix.platform }}
        run: .github/workflows/validate-exa-wheel.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pylance-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  arm64-smoke:
    name: Test aarch64 wheel
    needs: build
    runs-on: ubuntu-24.04-arm64-4x
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pylance-aarch64
          path: dist

      - name: Install wheel
        run: python -m pip install dist/*.whl boto3

      - name: Start S3 test service
        run: docker compose up -d --wait localstack

      - name: Test repeated local and TLS S3 opens
        run: python .github/workflows/test-exa-wheel-s3.py

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: arm64-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pylance-*
          path: dist
          merge-multiple: true

      - name: Validate release tag
        run: |
          expected_tag="$(
            python -c 'import tomllib; print("v" + tomllib.load(open("python/Cargo.toml", "rb"))["package"]["version"].replace("+", "-"))'
          )"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          generate_release_notes: true
